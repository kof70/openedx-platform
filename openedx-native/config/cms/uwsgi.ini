[uwsgi]
# uWSGI configuration for Open edX CMS (Studio)

# Application
module = cms.wsgi:application
env = DJANGO_SETTINGS_MODULE=cms.envs.production

# Process management
master = true
processes = 4
threads = 2
enable-threads = true

# Performance
max-requests = 5000
max-requests-delta = 100
harakiri = 60
vacuum = true
die-on-term = true

# Socket
http-socket = :8001
http-socket-timeout = 60

# Buffer sizes
buffer-size = 32768
post-buffering = 8192

# Logging
logto = /dev/stdout
log-x-forwarded-for = true
disable-logging = false

# Static files (served by Caddy in production)
static-map = /static=/openedx/staticfiles
static-map = /media=/openedx/media

# Offload static file serving to threads
offload-threads = 2

# Memory management
reload-on-rss = 512
worker-reload-mercy = 60

# Monitoring
stats = :9192
stats-http = true
