version: '3.8'

services:
  # MySQL 8.4 - Primary relational database
  mysql:
    image: mysql:8.4.0
    container_name: openedx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - openedx
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB 7.0 - Content metadata and modulestore
  mongodb:
    image: mongo:7.0.28
    container_name: openedx-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - openedx
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 7.4 - Caching, sessions, and Celery message broker
  redis:
    image: redis:7.4.5
    container_name: openedx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - openedx
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch 1.8 - Search functionality
  meilisearch:
    image: getmeili/meilisearch:v1.8.4
    container_name: openedx-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - openedx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LMS - Learning Management System (learner interface)
  lms:
    image: overhangio/openedx:21.0.1-indigo
    container_name: openedx-lms
    restart: unless-stopped
    environment:
      SERVICE_VARIANT: lms
      DJANGO_SETTINGS_MODULE: lms.envs.production
    env_file:
      - .env
    volumes:
      - ./config/lms:/openedx/config:ro
      - ./config/lms/uwsgi.ini:/openedx/uwsgi.ini:ro
      - openedx_media:/openedx/media
      - openedx_data:/openedx/data
      - openedx_static:/openedx/staticfiles
    networks:
      - openedx
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: uwsgi --ini /openedx/uwsgi.ini

  # CMS - Content Management System (Studio - authoring interface)
  cms:
    image: overhangio/openedx:21.0.1-indigo
    container_name: openedx-cms
    restart: unless-stopped
    environment:
      SERVICE_VARIANT: cms
      DJANGO_SETTINGS_MODULE: cms.envs.production
    env_file:
      - .env
    volumes:
      - ./config/cms:/openedx/config:ro
      - ./config/cms/uwsgi.ini:/openedx/uwsgi.ini:ro
      - openedx_media:/openedx/media
      - openedx_data:/openedx/data
      - openedx_static:/openedx/staticfiles
    networks:
      - openedx
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: uwsgi --ini /openedx/uwsgi.ini

  # LMS Celery Worker - Asynchronous task processing for LMS
  lms-worker:
    image: overhangio/openedx:21.0.1-indigo
    container_name: openedx-lms-worker
    restart: unless-stopped
    environment:
      SERVICE_VARIANT: lms
      DJANGO_SETTINGS_MODULE: lms.envs.production
      C_FORCE_ROOT: "1"
    env_file:
      - .env
    volumes:
      - ./config/lms:/openedx/config:ro
      - openedx_media:/openedx/media
      - openedx_data:/openedx/data
    networks:
      - openedx
    depends_on:
      - lms
      - redis
    command: celery --app=lms.celery worker --loglevel=info --max-tasks-per-child=100

  # CMS Celery Worker - Asynchronous task processing for CMS
  cms-worker:
    image: overhangio/openedx:21.0.1-indigo
    container_name: openedx-cms-worker
    restart: unless-stopped
    environment:
      SERVICE_VARIANT: cms
      DJANGO_SETTINGS_MODULE: cms.envs.production
      C_FORCE_ROOT: "1"
    env_file:
      - .env
    volumes:
      - ./config/cms:/openedx/config:ro
      - openedx_media:/openedx/media
      - openedx_data:/openedx/data
    networks:
      - openedx
    depends_on:
      - cms
      - redis
    command: celery --app=cms.celery worker --loglevel=info --max-tasks-per-child=100

  # Caddy 2.7 - Reverse proxy with automatic HTTPS
  # NOTE: Ports are NOT exposed here - Coolify's Traefik handles external routing
  caddy:
    image: caddy:2.7.4
    container_name: openedx-caddy
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - openedx_static:/openedx/staticfiles:ro
      - openedx_media:/openedx/media:ro
    networks:
      - openedx
    depends_on:
      - lms
      - cms
    command: sh -c 'cat > /etc/caddy/Caddyfile << "EOF"
{
    email admin@coolify.alonu.shop
}

lms.coolify.alonu.shop {
    reverse_proxy lms:8000 {
        header_up X-Forwarded-Proto {scheme}
        header_up X-Forwarded-For {remote}
        header_up X-Forwarded-Host {host}
    }
    
    handle /static/* {
        root * /openedx/staticfiles
        file_server
    }
    
    handle /media/* {
        root * /openedx/media
        file_server
    }
    
    encode gzip zstd
    
    header {
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        X-XSS-Protection "1; mode=block"
        Referrer-Policy "strict-origin-when-cross-origin"
        -Server
    }
}

studio.coolify.alonu.shop {
    reverse_proxy cms:8001 {
        header_up X-Forwarded-Proto {scheme}
        header_up X-Forwarded-For {remote}
        header_up X-Forwarded-Host {host}
    }
    
    handle /static/* {
        root * /openedx/staticfiles
        file_server
    }
    
    handle /media/* {
        root * /openedx/media
        file_server
    }
    
    encode gzip zstd
    
    header {
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        X-XSS-Protection "1; mode=block"
        Referrer-Policy "strict-origin-when-cross-origin"
        -Server
    }
}
EOF
caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'

# Named volumes for data persistence
volumes:
  mysql_data:
    name: openedx_mysql_data
  mongo_data:
    name: openedx_mongo_data
  redis_data:
    name: openedx_redis_data
  meilisearch_data:
    name: openedx_meilisearch_data
  openedx_media:
    name: openedx_media
  openedx_data:
    name: openedx_data
  openedx_static:
    name: openedx_static
  caddy_data:
    name: openedx_caddy_data
  caddy_config:
    name: openedx_caddy_config

# Bridge network for service communication
networks:
  openedx:
    name: openedx
    driver: bridge
